# Renders the R Markdown site and deploys it to GitHub Pages on every push to main.
#
# DISABLED BY DEFAULT. To turn it on:
#   1. uncomment the `on:` block below
#   2. in Settings > Pages, set Source to "GitHub Actions"
#
# Leave it off if you would rather build locally with build.R and commit docs/.
# Do not do both: they will fight over the same output.

name: Publish site

on:
  workflow_dispatch:
# on:
#   push:
#     branches: [main]
#   workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown

      - name: Render site
        run: Rscript -e 'rmarkdown::render_site(encoding = "UTF-8")'

      - name: Disable Jekyll
        run: touch docs/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
